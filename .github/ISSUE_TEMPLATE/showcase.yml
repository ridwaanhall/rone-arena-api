name: Add your project to the showcase
description: Show a site, app, or bot you built on the Rone Arena API at arena.rone.dev/showcase.
title: "[Showcase]: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building on Rone Arena. Accepted projects are listed on [arena.rone.dev/showcase](https://arena.rone.dev/showcase) with your name linked to you, and every endpoint you list opens in the playground so other developers can reproduce your pages.

        **Fastest way:** copy the prompt from [the showcase page](https://arena.rone.dev/showcase#add-your-project) into Claude, Codex, or any coding assistant opened in your project. It reads your code and writes the entry below for you, plus a link that opens this form already filled in.

  - type: textarea
    id: entry
    attributes:
      label: Showcase entry
      description: |
        One Python dict, in the same format as `app/web/showcase.py`, so it can be pasted in as-is.
        - `name`: the project name. Keep "MLBB" and "Mobile Legends" out of it; those marks belong to Moonton.
        - `url`: where anyone can open it right now.
        - `about`: one or two sentences on what it is and who it is for.
        - `shows`: what another developer learns from it.
        - `contributors`: `(name, link)` pairs. The link can be a personal website, GitHub, X, or Instagram.
        - `features`: `(feature, [(method, path), ...])` pairs, one per page or feature. Paths exactly as the API docs list them, with parameters in braces (`/api/heroes/{hero_identifier}/stats`, not `/api/heroes/1/stats`).
      render: python
      placeholder: |
        {
            "name": "Arena Academy",
            "url": "https://arena-academy.rone.dev/",
            "about": "A hero encyclopedia and stats site for Mobile Legends: Bang Bang.",
            "shows": "How to build a full website on the public hero and academy endpoints, without any sign-in.",
            "contributors": [("ridwaanhall", "https://ridwaanhall.com")],
            "features": [
                ("Home: top win rates this week", [("GET", "/api/heroes/rank")]),
                ("Hero page: lore, skills, relations", [("GET", "/api/heroes/{hero_identifier}"), ("GET", "/api/heroes/{hero_identifier}/relations")]),
            ],
        },
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source code
      description: Optional. A public repository, if the code is open. It helps reviewers check the endpoints.
      placeholder: https://github.com/you/your-project

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here so reviewers can see the project.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: The project is live and anyone can open it.
          required: true
        - label: Every endpoint in the entry is one the project actually calls.
          required: true
        - label: The name does not use "MLBB", "Mobile Legends", or Moonton branding.
          required: true
