name: Add your project to the showcase
description: Show a site, app, or bot you built on the Rone Arena API at arena.rone.dev/showcase.
title: "[Showcase]: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building on Rone Arena. Accepted projects are listed on https://arena.rone.dev/showcase with your name linked to you, and every endpoint you list opens in the playground so other developers can reproduce your pages.

        **Shortcut:** the showcase page has a prompt you can paste into Claude, Codex, or any coding assistant inside your project. It reads your code and fills in every field below for you.

        A filled-in example (Arena Academy) is on the showcase page under "Add your project".

  - type: input
    id: name
    attributes:
      label: Project name
      description: What the project is called. Keep "MLBB" and "Mobile Legends" out of the name; those marks belong to Moonton.
      placeholder: Arena Academy
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Live URL
      description: Where anyone can open it right now. A website, an app store page, or a bot invite.
      placeholder: https://arena-academy.rone.dev/
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source code
      description: Optional. A public repository, if the code is open.
      placeholder: https://github.com/you/your-project

  - type: textarea
    id: about
    attributes:
      label: About
      description: One or two sentences. What it is and who it is for.
      placeholder: A hero encyclopedia and stats site for Mobile Legends. Every hero page, ranking, and guide is rendered from public Rone Arena endpoints.
    validations:
      required: true

  - type: input
    id: shows
    attributes:
      label: Shows you
      description: What another developer learns from it, for example which endpoint group or pattern it demonstrates.
      placeholder: How to build a full website on the public hero and academy endpoints, without any sign-in.
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: Features and endpoints
      description: |
        One line per page or feature: the feature, a pipe (`|`), then the endpoints it calls, comma separated.
        Write paths exactly as the API docs list them, with path parameters in braces (`/api/heroes/{hero_identifier}/stats`, not `/api/heroes/1/stats`).
      placeholder: |
        Home: top win rates this week | GET /api/heroes/rank
        Hero page: lore, skills, relations | GET /api/heroes/{hero_identifier}, GET /api/heroes/{hero_identifier}/relations
        Tools: win-rate calculator | GET /api/addon/win-rate-calculator
    validations:
      required: true

  - type: input
    id: contributor
    attributes:
      label: Contributor name
      description: The name to credit on the showcase. Separate several names with commas.
      placeholder: ridwaanhall
    validations:
      required: true

  - type: textarea
    id: contributor_url
    attributes:
      label: Contributor link
      description: One link per name, in the same order. A personal website, GitHub, X, or Instagram.
      placeholder: https://ridwaanhall.com
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here so reviewers can see the project.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: The project is live and anyone can open it.
          required: true
        - label: Every endpoint listed above is one the project actually calls.
          required: true
        - label: The name does not use "MLBB", "Mobile Legends", or Moonton branding.
          required: true
