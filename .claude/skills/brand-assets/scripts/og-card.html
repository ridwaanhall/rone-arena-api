<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#f7f7f4;color:#121212;font-family:Archivo,sans-serif;padding:56px 72px;display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto 1fr auto;column-gap:40px}
.mark{grid-row:1/3;width:150px;height:150px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:"IBM Plex Mono";font-size:22px;color:#55554f;border-bottom:1.5px solid #121212;padding-bottom:14px}
.top b{color:#121212;font-weight:600}
main{padding-top:30px}
h1{font-size:112px;line-height:.92;font-weight:900;font-variation-settings:"wdth" 72;letter-spacing:-1px}
h1 span{background:#d4f53c;padding:0 12px;margin-left:4px}
p{font-size:32px;margin-top:22px;color:#33332f;line-height:1.25}
table{grid-column:1/3;width:100%;border-collapse:collapse;font-family:"IBM Plex Mono";font-size:22px;margin-top:8px}
td{border-top:1.5px solid #121212;padding:14px 0 0;}
td small{display:block;color:#6b6b63;font-size:17px;margin-top:2px}
td b{font-weight:600}
</style></head><body>
<svg class="mark" viewBox="0 0 64 64">{{MARK}}</svg>
<div class="top"><b>Free REST API</b><span>OpenAPI 3.1</span></div>
<main><h1>Rone Arena <span>API</span></h1>
<p>Game data for Mobile Legends: Bang Bang, as JSON.<br>Free, no key. Try every endpoint in your browser.</p></main>
<table><tr>
<td><b>Heroes</b><small>Rates, builds, counters</small></td>
<td><b>Academy</b><small>Guides and meta</small></td>
<td><b>Esports</b><small>League results</small></td>
<td><b>User</b><small>Player records</small></td>
<td><b>Addon</b><small>Utilities</small></td>
<td style="text-align:right"><b>arena.rone.dev</b><small>Unofficial community project</small></td>
</tr></table>
</body></html>
