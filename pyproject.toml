[project]
name = "rone-arena-api"
version = "1.1.0"
description = "Unofficial community data API for the game Mobile Legends: Bang Bang"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "ridwaanhall" }
]
requires-python = ">=3.12"

# The first four are what the app imports; they are also what pywrangler bundles into
# the Cloudflare Worker (Pyodide, sys_platform == "emscripten"). The server, CLI and
# dotenv extras are for local runs and FastAPI Cloud only.
dependencies = [
    "fastapi>=0.135.2",
    "jinja2>=3.1.4",
    "httpx>=0.28.1",
    "cryptography>=45",
    "fastapi[standard]>=0.135.2; sys_platform != 'emscripten'",
    "fastapi-cloud-cli>=0.22.0; sys_platform != 'emscripten'",
]

[project.urls]
Homepage = "https://arena.rone.dev"
Documentation = "https://arena.rone.dev/api/docs"
Repository = "https://github.com/ridwaanhall/rone-arena-api"
Issues = "https://github.com/ridwaanhall/rone-arena-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

# `fastapi run` / FastAPI Cloud: the app lives in the installed `app` package (src layout).
[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    # Cloudflare Workers tooling: `uv run pywrangler dev|deploy`. pywrangler shells out to
    # `uv` and needs >=0.12.3; installing it here puts a new enough uv first on PATH under
    # `uv run`, whatever version the build image ships.
    "workers-py>=1.17.4",
    "workers-runtime-sdk",
    "uv>=0.12.3",
]
